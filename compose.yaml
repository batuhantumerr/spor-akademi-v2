# Local development dependencies. The PostgreSQL image here is the single source of truth:
# Testcontainers reads the same reference (P1-08), so local, CI and tests run one version.
name: spor-akademi-v2

services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    # P4-08 (DEC-563): pg_stat_statements is loaded so the most frequent and slowest queries can be listed (the
    # extension itself is created only in the load test database, by scripts/perf/run-k6.sh).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPOR_AKADEMI_DB: spor_akademi
      SPOR_AKADEMI_MIGRATOR_PASSWORD: ${SPOR_AKADEMI_MIGRATOR_PASSWORD:?set SPOR_AKADEMI_MIGRATOR_PASSWORD in .env}
      SPOR_AKADEMI_APP_PASSWORD: ${SPOR_AKADEMI_APP_PASSWORD:?set SPOR_AKADEMI_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spor_akademi"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Distributed cache (L2 of HybridCache, DEC-310): Valkey, BSD-3 licensed and Redis-protocol compatible.
  # Cache only: nothing is written to disk, and the oldest keys are evicted when memory is full.
  # Testcontainers reads this image reference too.
  # Optional (DEC-316): only started with `docker compose --profile cache up -d --wait`. The password is not a
  # required compose variable (compose interpolates every service, even ones outside the active profiles), so a
  # .env without VALKEY_PASSWORD still works for everything else; Valkey itself refuses to start without it.
  # The password goes into a config file in the container (not the server's process arguments); the image's
  # entrypoint then hands /data to the valkey user and drops root.
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    profiles: ["cache"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -z "$$VALKEY_PASSWORD" ]; then echo "VALKEY_PASSWORD is not set in .env (bash scripts/setup-env.sh adds it)" >&2; exit 1; fi;
        umask 077; printf 'requirepass %s\n' "$$VALKEY_PASSWORD" > /data/valkey.conf;
        exec docker-entrypoint.sh valkey-server /data/valkey.conf --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local e-mail catcher (P2-F4, DEC-357): Mailpit, MIT licensed. Optional: only started with
  # `docker compose --profile mail up -d --wait`; scripts/run-api.sh then points the API's SMTP at it. It never relays
  # mail anywhere: every message stays in Mailpit and is read in its web UI. Both ports listen on 127.0.0.1 only and
  # need no .env key (the host ports have defaults). Testcontainers reads this image reference too.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    profiles: ["mail"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-51025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  seq:
    image: datalust/seq:2026.1.17526@sha256:76f6ecdf9f742442f5b7e31eb9b94084b952af0575049d5c1e9d9101a6c8100f
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:${SEQ_HOST_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  # S3-compatible document storage for local development only (DEC-320); production storage is a deploy
  # decision. Testcontainers reads this same image reference. Objects are private: only signed requests
  # with the credentials below (or links the API signs) can read or write. The bucket is created on start
  # if it does not exist yet (idempotent).
  # Optional (DEC-326): only started with `docker compose --profile storage up -d --wait`. The credentials are not
  # required compose variables (compose interpolates every service, even ones outside the active profiles), so a
  # .env without them still works for everything else; the container itself refuses to start without them or
  # with the .env.example placeholders (SeaweedFS without credentials would accept anonymous requests).
  storage:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    profiles: ["storage"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-spor-akademi-documents}
    entrypoint:
      - sh
      - -c
      - >-
        case "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" in :*|*:|change-me*|*:change-me*) echo "STORAGE_ACCESS_KEY and STORAGE_SECRET_KEY are not set in .env, or still change-me (bash scripts/setup-env.sh adds them)" >&2; exit 1;; esac;
        exec /entrypoint.sh mini -dir=/data -bucket="$$STORAGE_BUCKET" -master.telemetry=false -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "127.0.0.1:${STORAGE_HOST_PORT:-58333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Local observability (P4-07, DEC-554): optional, only started with `docker compose --profile observability up -d --wait`;
  # scripts/run-api.sh then sends the API's traces and metrics there over OTLP. All Apache-2.0 (no AGPL image, as with
  # DEC-320): Jaeger v2 receives OTLP, keeps traces in memory and passes metrics to Prometheus, which evaluates the alert
  # rules; Perses shows the dashboards. Configuration, alert rules and dashboards are files under docker/observability.
  # Every port listens on 127.0.0.1 only and needs no .env key (the host ports have defaults). Nothing is persisted.
  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    profiles: ["observability"]
    command: ["--config", "/etc/jaeger/jaeger.yaml"]
    volumes:
      - ./docker/observability/jaeger.yaml:/etc/jaeger/jaeger.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-54317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-54318}:4318"
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-56686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-57090}:9090"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  perses:
    image: persesdev/perses:v0.55.1@sha256:292605f009770f07aa17217e70f877fabbc74858d0af9054d395064e1c411c06
    profiles: ["observability"]
    command: ["--config", "/etc/perses/config.yaml"]
    volumes:
      - ./docker/observability/perses/config.yaml:/etc/perses/config.yaml:ro
      - ./docker/observability/perses/provisioning:/etc/perses/provisioning:ro
    ports:
      - "127.0.0.1:${PERSES_HOST_PORT:-58080}:8080"
    depends_on:
      prometheus:
        condition: service_healthy

  # Load test (P4-08, DEC-564, DEC-565): optional, only with `--profile scale` (scripts/perf/run-k6.sh starts it). Two API
  # instances (Release image, docker/api/Dockerfile) on the load test database spor_akademi_perf, sharing the Valkey L2
  # cache and SignalR backplane (`--profile cache`), behind Caddy (Apache-2.0) as the reverse proxy. Only here are the
  # rate limits raised: one k6 process signs every account in from one address (DEC-561); the image defaults stay. The
  # APIs trust X-Forwarded-For only from the proxy's fixed address (DEC-507). Ports listen on 127.0.0.1 only.
  api-1: &perf-api
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: spor-akademi-api:perf
    profiles: ["scale"]
    environment:
      ASPNETCORE_ENVIRONMENT: LoadTest
      ConnectionStrings__App: Host=postgres;Port=5432;Database=spor_akademi_perf;Username=spor_akademi_app;Password=${SPOR_AKADEMI_APP_PASSWORD:-};Maximum Pool Size=${PERF_DB_POOL_SIZE:-40}
      ConnectionStrings__Cache: valkey:6379,password=${VALKEY_PASSWORD:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      ForwardedHeaders__KnownProxies__0: 172.30.208.10
      # scripts/perf/run-k6.sh --checks sets the production values (DEC-504, DEC-388) to observe the limits themselves.
      RateLimiting__UserPermitsPerMinute: ${PERF_USER_PERMITS:-1000000}
      RateLimiting__SchoolWritePermitsPerMinute: ${PERF_SCHOOL_WRITE_PERMITS:-1000000}
      RateLimiting__AnonymousPermitsPerMinute: ${PERF_ANONYMOUS_PERMITS:-1000000}
      RateLimiting__AuthPermitsPerMinute: ${PERF_AUTH_PERMITS:-1000000}
      RateLimiting__ParentPermitsPerMinute: ${PERF_PARENT_PERMITS:-1000000}
    networks: [default, perf]
    ports:
      - "127.0.0.1:${PERF_API_1_HOST_PORT:-58181}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  api-2:
    <<: *perf-api
    ports:
      - "127.0.0.1:${PERF_API_2_HOST_PORT:-58182}:8080"

  proxy:
    image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    profiles: ["scale"]
    environment:
      # The hub's load balancing: cookie affinity (DEC-565); round_robin shows why it is needed.
      HUB_LB_POLICY: ${PERF_HUB_LB_POLICY:-cookie}
    volumes:
      - ./perf/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      perf:
        ipv4_address: 172.30.208.10
    ports:
      - "127.0.0.1:${PERF_PROXY_HOST_PORT:-58180}:8080"
    depends_on: [api-1, api-2]

  # k6 (AGPL-3.0, DEC-560): only run as a separate tool container, never linked into or shipped with the application.
  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: ["k6"]
    volumes:
      - ./perf/k6:/perf
    working_dir: /perf
    networks: [perf]

networks:
  perf:
    ipam:
      config:
        - subnet: 172.30.208.0/24

volumes:
  postgres-data:
  seq-data:
  storage-data:
