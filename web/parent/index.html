<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Static fallback; pages set their title from src/i18n/tr.ts. -->
    <title>Spor Akademi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // Apply the stored or system theme before first paint to avoid a flash (same key as web/admin).
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('sa-theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      html.light,
      html.light body {
        background: #f8fafc;
        color: #0f172a;
        color-scheme: light;
      }
      html.dark,
      html.dark body {
        background: #121620;
        color: #edf2f7;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
