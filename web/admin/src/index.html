<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Static fallback; the router sets page titles from ui.appName in core/i18n/tr.ts. -->
    <title>Spor Akademi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- P4-01: no inline script or style (Content-Security-Policy). Theme and language before first paint. -->
    <script src="boot.js"></script>
    <link rel="stylesheet" href="boot.css" />
  </head>
  <body>
    <app-root>
      <!-- Replaced when Angular renders; shown while the session is being restored. -->
      <div class="boot-loading" role="status" aria-live="polite">
        <span lang="tr">Yükleniyor…</span>
        <span lang="en">Loading…</span>
      </div>
    </app-root>
  </body>
</html>
