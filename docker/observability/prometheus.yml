# Local observability (P4-07, DEC-554): Prometheus (Apache-2.0) scrapes the API's metrics from Jaeger's exporter and
# evaluates the alert rules (alerts.yml). There is no Alertmanager locally: firing alerts are shown at /alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spor-akademi-otlp
    # job and instance come from the API's resource (service.name, service.instance.id).
    honor_labels: true
    static_configs:
      - targets: ["jaeger:8889"]
