server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # P2-F4 (DEC-352): the set-password page must never leak its URL to another site (Referrer-Policy).
    # nosniff: files are served only as their declared type. frame-ancestors 'none' (and X-Frame-Options for older
    # browsers): no site may frame the app, so a form cannot be clickjacked. add_header in a location replaces the
    # server's headers, so every location repeats the whole set.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Hashed build output never changes.
    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # P3-08 (DEC-402): /api and /hubs (SignalR) belong to the API. This image serves static files only; the reverse
    # proxy in front (Caddy, Deploy block) routes both to the API, /hubs with the WebSocket upgrade. A request that still
    # reaches this server gets 404 instead of the SPA's index.html, so a misrouted hub fails clearly and nothing caches it.
    location ~* ^/(api|hubs)(/|$) {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
