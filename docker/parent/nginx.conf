server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Same headers as docker/admin/nginx.conf. P2-F4 (DEC-352): invitation and password pages (P3-05) must
    # never leak their URL to another site (Referrer-Policy).
    # nosniff: files are served only as their declared type. frame-ancestors 'none' (and X-Frame-Options for older
    # browsers): no site may frame the app, so a form cannot be clickjacked. add_header in a location replaces the
    # server's headers, so every location repeats the whole set.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # P3-07 (DEC-394): the service worker and the web app manifest keep their names across versions, so the browser
    # must ask again every time (a stale sw.js would pin an old version). The types are set explicitly: the
    # worker must be JavaScript, and older mime.types lack webmanifest.
    location = /sw.js {
        types { text/javascript js; }
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Hashed build output never changes (the install icons are hashed too, pwa/icons.ts).
    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # P3-08 (DEC-402): /api and /hubs (SignalR) belong to the API. This image serves static files only; the reverse
    # proxy in front (Caddy, Deploy block) routes both to the API, /hubs with the WebSocket upgrade. A request that still
    # reaches this server gets 404 instead of the SPA's index.html, so a misrouted hub fails clearly and nothing caches it.
    location ~* ^/(api|hubs)(/|$) {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
