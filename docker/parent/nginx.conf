server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # P4-01: the security headers (Content-Security-Policy and the rest) live in one file, security-headers.inc.
    # add_header in a location replaces the server's headers, so every location includes it again.
    include /etc/nginx/conf.d/security-headers.inc;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # P4-01 (DEC-502): the pre-paint theme script and style keep their names across versions (they replace the
    # inline ones the policy forbids), so the browser must ask again every time, like index.html. The service worker
    # precaches them with the other public files.
    location ~ ^/boot\.(?:js|css)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # P3-07 (DEC-394): the service worker and the web app manifest keep their names across versions, so the browser
    # must ask again every time (a stale sw.js would pin an old version). The types are set explicitly: the
    # worker must be JavaScript, and older mime.types lack webmanifest.
    location = /sw.js {
        types { text/javascript js; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Hashed build output never changes (the install icons are hashed too, pwa/icons.ts).
    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # P3-08 (DEC-402): /api and /hubs (SignalR) belong to the API. This image serves static files only; the reverse
    # proxy in front (Caddy, Deploy block) routes both to the API, /hubs with the WebSocket upgrade. A request that still
    # reaches this server gets 404 instead of the SPA's index.html, so a misrouted hub fails clearly and nothing caches it.
    location ~* ^/(api|hubs)(/|$) {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
