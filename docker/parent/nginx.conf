server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Same headers as docker/admin/nginx.conf. P2-F4 (DEC-352): invitation and password pages (P3-05) must
    # never leak their URL to another site. add_header in a location replaces the server's headers, so every
    # location repeats it.
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Hashed build output never changes.
    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
