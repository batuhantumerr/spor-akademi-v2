version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    groups:
      nuget-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web/admin
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: angular-eslint
        update-types: [version-update:semver-major]
      - dependency-name: rxjs
        update-types: [version-update:semver-major]
      - dependency-name: tslib
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: docker
    directories: ["/docker/*"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: "chore(deps)" }
    groups:
      docker-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: "chore(deps)" }
