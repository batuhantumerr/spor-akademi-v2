name: e2e setup
description: >
  Shared preparation of the Playwright jobs (P4-11, DEC-591): .NET and Node, package caches, a throwaway .env, the
  compose PostgreSQL, the API restore, the admin and parent npm packages and the Playwright browsers. scripts/e2e.sh
  does the rest (database, migrations, builds, Mailpit).
inputs:
  browsers:
    description: Playwright browsers to install (space separated).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: web/admin/.nvmrc
        cache: npm
        cache-dependency-path: |
          web/admin/package-lock.json
          web/parent/package-lock.json
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-e2e-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json') }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('web/admin/package-lock.json') }}
    # The browsers' system packages (apt, ~125 MB for all three) are kept as .deb files: on 2026-11-18 the Ubuntu mirror
    # served them at ~120 kB/s and the e2e job hit its timeout twice inside this action (#181). The key changes every ISO
    # week, so Ubuntu's package updates get into the cache; the prefix restore key reuses the previous archive and apt
    # only downloads what is missing. apt may download as root here (its _apt user cannot reach the runner's
    # directories) and says so in a notice; that is harmless.
    - name: Apt archive cache key
      id: apt-key
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: apt-cache
      with:
        path: ${{ runner.temp }}/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ inputs.browsers }}-${{ steps.apt-key.outputs.week }}
        restore-keys: playwright-apt-${{ runner.os }}-${{ inputs.browsers }}-
    - name: Throwaway .env (random values, never printed; the runner is discarded)
      shell: bash
      run: |
        umask 077
        {
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
          echo "SPOR_AKADEMI_MIGRATOR_PASSWORD=$(openssl rand -hex 24)"
          echo "SPOR_AKADEMI_APP_PASSWORD=$(openssl rand -hex 24)"
          echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)"
        } > .env
    - name: Start PostgreSQL (the compose.yaml image and init script)
      shell: bash
      run: docker compose up -d --wait postgres
    # scripts/e2e.sh starts the compose Mailpit (mail profile) itself for the parent invitation e-mail (P3-05).
    - name: Restore
      shell: bash
      run: |
        dotnet tool restore
        dotnet restore src/SporAkademi.Api/SporAkademi.Api.csproj --locked-mode
    - name: Install npm packages and Playwright browsers
      shell: bash
      working-directory: web/admin
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        npm ci --no-fund
        npm --prefix ../parent ci --no-fund
        # apt (run by playwright install-deps) downloads into the cached archive directory and keeps the files there.
        archives="$RUNNER_TEMP/apt-archives"
        mkdir -p "$archives/partial"
        printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$archives" \
          | sudo tee /etc/apt/apt.conf.d/99playwright-archives >/dev/null
        echo "Cached apt archives: $(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages"
        # Word splitting on purpose: one argument per browser.
        npx playwright install --with-deps $BROWSERS
        # Drop packages the mirror no longer has, and hand the files to the runner user so the cache can be saved.
        sudo apt-get autoclean -qq
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        echo "Cached apt archives after install: $(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages, $(du -sh "$archives" | cut -f1)"
    # Saved right after the install, not at the end of the job, so a run whose tests fail still keeps the packages.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.apt-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
